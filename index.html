<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>

<style>

body{
    font-family: Arial, sans-serif;
    background-color: #a7caf7;
}

.container{
    width: 800px;
    margin: auto;
    background: #704dfc;
    padding: 20px;
}

h1{
    text-align: center;
    font-size: 50px;
    margin-bottom: 40px;
}

table{
    width: 100%;
}

td{
    padding: 12px;
    font-size: 22px;
}

input[type="text"],
input[type="email"],
input[type="password"],
input[type="date"],
textarea,
select{
    width: 100%;
    padding: 10px;
    font-size: 18px;
    border: 1px solid #999;
}

textarea{
    height: 100px;
}

.gender,
.department{
    font-size: 20px;
}

button{
    padding: 10px 25px;
    font-size: 18px;
    cursor: pointer;
}

.center{
    text-align: center;
}

</style>
</head>

<body>

<div class="container">

<h1>Student Registration Form</h1>

<form>

<table>

<tr>
<td>Roll no. :</td>
<td><input type="text"></td>
</tr>

<tr>
<td>Student name :</td>
<td>
<input type="text" placeholder="First Name">
<br><br>
<input type="text" placeholder="Last Name">
</td>
</tr>

<tr>
<td>Father's name :</td>
<td><input type="text"></td>
</tr>

<tr>
<td>Date of birth :</td>
<td><input type="date"></td>
</tr>

<tr>
<td>Mobile no. :</td>
<td><input type="text" placeholder="+91"></td>
</tr>

<tr>
<td>Email id :</td>
<td><input type="email"></td>
</tr>

<tr>
<td>Password :</td>
<td><input type="password"></td>
</tr>

<tr>
<td>Gender :</td>
<td class="gender">
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
</td>
</tr>

<tr>
<td>Department :</td>
<td class="department">
<input type="checkbox"> CSE
<input type="checkbox"> IT
<input type="checkbox"> ECE
<input type="checkbox"> Civil
<input type="checkbox"> Mech
</td>
</tr>

<tr>
<td>Course :</td>
<td>
<select>
<option>Select Current Course</option>
<option>BCA</option>
<option>B.Tech</option>
<option>MCA</option>
<option>B.Sc</option>
</select>
</td>
</tr>

<tr>
<td>Student photo :</td>
<td><input type="file"></td>
</tr>

<tr>
<td>City :</td>
<td><input type="text"></td>
</tr>

<tr>
<td>Address :</td>
<td><textarea></textarea></td>
</tr>

<tr>
<td colspan="2" class="center">
<button type="submit">Register</button>
</td>
</tr>

</table>

</form>

</div>

</body>
</html>
